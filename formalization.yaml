version: v0.4
project:
  name: Finite sequence routing formulations and continuous timing
  description: A qualified finite sequence-routing formalization connecting the complete source binary
    rows with padded elementary customer routes and exact transition cost. For fixed valid slots, explicit
    zero-depot clock/travel conditions give continuous timing feasibility through the earliest-schedule
    recurrence and an attained minimum total return over timing assignments. Capacity and global route
    optimization are outside scope.
  authors:
  - David E. Bernal Neira
  responsible_maintainers:
  - David E. Bernal Neira
  license: Apache-2.0
repository:
  role: substantive-development
classification:
  arxiv:
  - math.OC
  msc2020:
  - 90C27
  - 90C11
sources:
- title: Modern computational approaches to nonlinear discrete optimization and applications in process
    systems engineering
  authors:
  - David E. Bernal Neira
  type: other
  relationship: adapts
  location: Carnegie Mellon University, Ph.D. thesis, 2021, Chapter 10; sequence-based and continuous-time
    sequence formulations
  note: The exact literal binary rows, nested timing sums and fixed-route duration interpretation are
    represented with explicit coverage, padding and depot qualifications. Source documents are cited rather
    than redistributed; no whole-thesis certification or source-author endorsement is asserted.
- title: Formulating and solving routing problems on quantum computers
  authors:
  - Stuart Harwood
  - Claudio Gambella
  - Dimitar Trenev
  - Andrea Simonetto
  - David Bernal
  - Donny Greenberg
  id: doi:10.1109/TQE.2021.3049230
  type: paper
  relationship: background
  location: IEEE Transactions on Quantum Engineering 2, article 3100117 (2021)
  note: Joint source research underlying the thesis chapter. This package does not establish a version-of-record
    correction or claim quantum performance, optimizer implementation or author endorsement.
status:
  scope: 'Finite n customers, v vehicle slots, P=k+2 positions: literal sequence rows are equivalent to
    one-hot slot encodings; decoded routes are elementary with length at most k and allowed arcs; bounded
    exact-once route families encode back with exact decoded cost when depot padding is allowed and depot-loop
    cost is zero. For fixed valid slots, zero depot clock and zero depot-loop travel time give exact equivalence
    of literal timing rows and position schedules; timing feasibility is equivalent to earliest-recursion
    closing feasibility, and earliest total return is attained and minimal over feasible clocks for that
    fixed route family. Empty finite domains and idle routes remain quantified. Load capacity, route/global
    optimum completeness, arc grids, pruning optimality, ADMM/SCP, solver and quantum/empirical claims
    are excluded.'
  main_results:
  - declaration: Chapter10.Sequence.palomar_literal_iff_decoded
    file: Solution.lean
    comparator_config: comparator.json
